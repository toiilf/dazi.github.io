<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
  <title>小鹤双拼在线练习 - 免费打字训练平台</title>
  <meta name="description" content="专业的小鹤双拼打字练习工具。提供键位提示与实时反馈，无需下载，打开即练，帮你快速形成肌肉记忆。">
  <meta name="keywords" content="小鹤双拼, 双拼练习, 双拼打字, 在线打字练习, 小鹤双拼方案">
  
  <!-- PWA 基础配置 -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#667eea">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="小鹤双拼">
  
  <!-- 使用键盘相关的网络图标 -->
  <link rel="icon" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5.1/svgs/solid/keyboard.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5.1/svgs/solid/keyboard.svg">
  
  <style>
    /* 全局重置 & 统一风格 */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      -webkit-text-size-adjust: 100%;
      -moz-text-size-adjust: 100%;
      -ms-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* 首页卡片容器 – 与子页面保持一致的圆角、阴影、白底 */
    .home-container {
      background: white;
      border-radius: 20px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.12);
      padding: 40px 36px;
      max-width: 560px;
      width: 100%;
      transition: transform 0.25s ease;
      text-align: center;
    }

    .home-header {
      margin-bottom: 32px;
    }

    .home-title {
      font-size: 32px;
      font-weight: 700;
      color: #1e1e2f;
      letter-spacing: 1px;
    }

    .home-title small {
      font-size: 16px;
      font-weight: 400;
      color: #6b7280;
      display: block;
      margin-top: 6px;
      letter-spacing: 0.3px;
    }

    .home-sub {
      color: #6b7280;
      font-size: 15px;
      margin-top: 6px;
      border-top: 1px solid #f0f0f5;
      padding-top: 14px;
    }

    /* 按钮网格 */
    .home-grid {
      display: flex;
      flex-direction: column;
      gap: 18px;
      margin: 28px 0 10px;
    }

    .home-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 20px 16px;
      border: none;
      border-radius: 16px;
      font-size: 22px;
      font-weight: 600;
      color: white;
      background: #667eea;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 4px 8px rgba(102, 126, 234, 0.25);
      text-decoration: none;
      -webkit-tap-highlight-color: transparent;
    }

    .home-btn:active {
      transform: scale(0.97);
    }

    .home-btn .icon {
      font-size: 30px;
      line-height: 1;
    }

    .home-btn.word-btn {
      background: linear-gradient(145deg, #667eea, #5a67d8);
    }

    .home-btn.word-btn:hover {
      background: linear-gradient(145deg, #5a67d8, #4c51bf);
      box-shadow: 0 8px 18px rgba(102, 126, 234, 0.35);
      transform: translateY(-2px);
    }

    .home-btn.article-btn {
      background: linear-gradient(145deg, #38b2ac, #2c978f);
      box-shadow: 0 4px 8px rgba(56, 178, 172, 0.25);
    }

    .home-btn.article-btn:hover {
      background: linear-gradient(145deg, #2c978f, #1f7a73);
      box-shadow: 0 8px 18px rgba(56, 178, 172, 0.35);
      transform: translateY(-2px);
    }

    .home-footer {
      margin-top: 24px;
      color: #9ca3af;
      font-size: 13px;
      letter-spacing: 0.5px;
      border-top: 1px solid #f3f4f8;
      padding-top: 18px;
    }

    /* 响应式调整 */
    @media (max-width: 480px) {
      .home-container {
        padding: 28px 20px;
      }
      .home-title {
        font-size: 26px;
      }
      .home-btn {
        font-size: 19px;
        padding: 16px 12px;
      }
      .home-btn .icon {
        font-size: 26px;
      }
    }

    /* 统一 scroll 风格（与子页面一致） */
    ::-webkit-scrollbar {
      width: 3px;
    }
    ::-webkit-scrollbar-thumb {
      background: #d1d5db;
      border-radius: 2px;
    }

    /* 确保 body 背景和子页面完全一致 */
    body {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    }
  </style>
</head>
<body>
  <div class="home-container">
    <div class="home-header">
      <h1 class="home-title">
        🦩 小鹤双拼
        <!--small>词语练习 · 文章跟打</small-->
      </h1>
      <div class="home-sub">选择练习模式，开始你的双拼之旅</div>
    </div>

    <div class="home-grid">
      <!-- 单字练习 → dan.html -->
      <a class="home-btn word-btn" href="dan.html" role="button">
        <span class="icon">〶</span>
        单字练习
      </a>

      <!-- 词语练习 → pin.html -->
      <a class="home-btn word-btn" href="pin.html" role="button">
        <span class="icon">⌨️</span>
        词语练习
      </a>

      <!-- 文章练习 → wenzhang.html -->
      <a class="home-btn article-btn" href="wenzhang.html" role="button">
        <span class="icon">📖</span>
        文章练习
      </a>
    </div>

    <div class="home-footer">
      <span>小鹤双拼·在线练习</span>
    </div>
  </div>

  <!-- Service Worker 注册 -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js')
          .then(reg => console.log('✅ Service Worker 注册成功', reg.scope))
          .catch(err => console.warn('⚠️ Service Worker 注册失败', err));
      });
    }
  </script>
</body>
</html>
